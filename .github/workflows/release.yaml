name: Build and Deploy on Tag

on:
  push:
    tags:
      - 'v*'  # Срабатывает на теги, начинающиеся с 'v' (v1.0.0, v2.1.3, etc.)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    
    steps:
      # 1. Клонируем репозиторий с кодом
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

       # 3. Логинимся в GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # 4. Собираем и пушим образ в реестр
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jeo-pardy-app:latest
            ghcr.io/${{ github.repository_owner }}/jeo-pardy-app:${{ github.sha }}
          build-args: |
            VITE_APP_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            VITE_APP_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_KEY }}
            VITE_REACT_APP_TINYBIRD_HOST=${{ secrets.TINYBIRD_HOST }}
            VITE_REACT_APP_TINYBIRD_APPEND_TOKEN=${{ secrets.TINYBIRD_APPEND_TOKEN }}


      # 5. Деплой на NAS через SSH
      - name: Deploy to Synology NAS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_IP }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          debug: true
          script: |
            # Логируем деплой
            echo "🚀 Starting deployment on NAS"

            # Переходим в папку с приложением
            cd /volume1/docker/jeo-pardy-app || exit 1
            
            # Логинимся в GHCR на NAS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Скачиваем новый образ
            docker pull ghcr.io/${{ github.repository_owner }}/jeo-pardy-app:latest
            
            # Останавливаем старый контейнер
            docker stop jeo-pardy-app 2>/dev/null || true
            docker rm jeo-pardy-app 2>/dev/null || true
            
            # Запускаем новый контейнер с правильными переменными окружения
            docker run -d \
              --name jeo-pardy-app \
              --restart always \
              -p 8082:80 \
              ghcr.io/${{ github.repository_owner }}/jeo-pardy-app:latest
      
      # 6. Проверяем, что приложение работает
      - name: Health check
        run: |
          sleep 5
          if curl -f http://localhost:8082; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Health check failed!"
            exit 1
          fi